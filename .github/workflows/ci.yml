name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  static:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  contract:
    name: Contract tests against the stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - name: Start the stack
        run: docker compose up -d
      - name: Initialise Odoo
        run: npm run init:odoo
      - name: Seed synthetic data
        run: npm run seed
        env:
          SEED_CUSTOMERS: '25'
      - name: Contract tests
        run: npm run test:contract
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail=120
      - name: Stop the stack
        if: always()
        run: docker compose down -v
