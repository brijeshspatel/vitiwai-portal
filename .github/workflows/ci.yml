name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Playwright is a devDependency, used only by `npm run screenshots`, which a
# person runs locally. Without this, every `npm ci` here would pull a browser
# build of several hundred megabytes that no job then uses.
# The workflow reads the repository and writes nothing back. Naming that
# explicitly matters more once the repository is public: the default token
# permission is a repository-wide setting, and this does not depend on it.
permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  static:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  contract:
    name: Contract tests against the stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - name: Start the stack
        run: docker compose up -d
      - name: Initialise Odoo
        run: npm run init:odoo
      - name: Apply portal migrations
        run: npm run migrate
      - name: Seed synthetic data
        run: npm run seed
        env:
          SEED_CUSTOMERS: '25'
      # The interface tests read HTML from a running portal, so the contract job
      # has to serve one. It is built here rather than reused from the other job
      # because the two jobs run on separate runners with no shared filesystem.
      - name: Give a seeded customer a password
        run: npm run demo:credential
      - name: Build the portal
        run: npm run build
      - name: Start the portal and wait for it
        run: |
          npm start &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/; then
              echo "PASS - the portal answered after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "FAIL - the portal did not answer within 60s"
          exit 1
      - name: Contract tests
        run: npm run test:contract
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail=120
      - name: Stop the stack
        if: always()
        run: docker compose down -v
